name: Build ARM64 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Read Version
        id: ver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Configure Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> $GITHUB_ENV
            echo "ALIAS=$SECRET_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias croix_release \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass CroixRelease2026! -keypass CroixRelease2026! \
              -dname "CN=Croix Player, OU=Mobile, O=Croix, C=PE"
            echo "STORE_PASSWORD=CroixRelease2026!" >> $GITHUB_ENV
            echo "ALIAS=croix_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=CroixRelease2026!" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew --console=plain --no-daemon :engine:ytmusic:test :core:design:testDebugUnitTest

      - name: Assemble Release APK
        run: ./gradlew --console=plain --no-daemon :app:assembleRelease

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi
          cp "$APK_PATH" CroixPlayer-arm64-v8a.apk

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}"
          TITLE="Croix Player ${TAG}"
          NOTES="Version ${VERSION_NAME} para Android 12 o superior (arm64-v8a). Descarga el archivo CroixPlayer-arm64-v8a.apk e instalalo directamente."

          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" CroixPlayer-arm64-v8a.apk --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
          else
            gh release create "${TAG}" CroixPlayer-arm64-v8a.apk \
              --title "${TITLE}" --notes "${NOTES}" --latest
          fi
